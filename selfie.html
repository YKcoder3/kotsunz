<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1233">
<title>コツンズ自撮り | コツンズ</title>
<style>
/* かわいいロゴ用のフォント（カタカナだけに小さくしたもの。SIL Open Font License 1.1） */
@font-face{font-family:"KZ Pop";src:url("assets/fonts/mochiy-pop-one-katakana.woff2") format("woff2");font-display:block}
@font-face{font-family:"KZ Hand";src:url("assets/fonts/hachi-maru-pop-katakana.woff2") format("woff2");font-display:block}
@font-face{font-family:"KZ Bold";src:url("assets/fonts/dela-gothic-one-katakana.woff2") format("woff2");font-display:block}
:root{--ink:#2a1d55;--pink:#ff6fae;--pink2:#ff4f97;--violet:#6f48d8;--sky:#7cc8ff;--sun:#ffd54a;--bg1:#1b1233;--bg2:#33205f;font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg1);color:#fff;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}
.hidden{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#4b2f86 0%,var(--bg1) 62%)}
/* 上の小さなバー */
.bar-top{display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 14px 6px;min-height:52px}
.logo-mini{font-family:"KZ Pop",system-ui;font-size:22px;color:#fff;-webkit-text-stroke:5px #2a1d55;paint-order:stroke fill;letter-spacing:.5px;text-shadow:0 3px 0 #ff6fae}
.logo-mini small{font-family:system-ui;font-size:11px;font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#ffd6ea;margin-left:6px;vertical-align:middle}
.chip-toggle{display:flex;background:#ffffff1f;border-radius:999px;padding:3px}
.chip-toggle button{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:850;color:#e9defd}
.chip-toggle button[aria-pressed=true]{background:#fff;color:var(--ink)}
/* ファインダー */
.finder-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0}
.finder{position:relative;width:300px;height:400px;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #ffffff22,0 18px 40px #0008}
.finder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder video.mirror{transform:scaleX(-1)}
.finder .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.8;color:#e6dcff}
.finder .pill{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#00000070;backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:850}
.finder .inset{position:absolute;top:12px;left:12px;width:28%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 14px #0007;background:#222}
.finder .inset canvas{width:100%;height:100%;object-fit:cover;display:block}
.finder .count{position:absolute;inset:0;display:grid;place-items:center;font-family:"KZ Pop",system-ui;font-size:110px;color:#fff;-webkit-text-stroke:8px #2a1d55;paint-order:stroke fill;text-shadow:0 8px 0 #ff6fae;pointer-events:none}
.finder .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.finder .flash.on{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
/* 下のバー（親指でとどく位置） */
.bar-bottom{padding:10px 18px max(16px,calc(env(safe-area-inset-bottom) + 8px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.round{width:58px;height:58px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1.1;text-align:center}
.round .i{font-size:22px;display:block}
.round.home{justify-self:start}
.round.flip{justify-self:end}
.shutter{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #ffffff40,0 0 0 9px #ff6fae;display:grid;place-items:center;transition:transform .1s}
.shutter:active{transform:scale(.92)}
.shutter span{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#ff9bc8,#ff4f97)}
.under{text-align:center;padding:0 0 4px}
.linkish{font-size:13px;font-weight:800;color:#ffd6ea;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
/* 編集 */
.edit-top{display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 12px 4px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px}
#cv{max-width:100%;max-height:100%;border-radius:18px;box-shadow:0 14px 36px #0009;touch-action:none;background:#2a1d55;display:block}
.panel{background:#fff;color:var(--ink);border-radius:26px 26px 0 0;padding:10px 14px 0;box-shadow:0 -8px 30px #0005}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f2ecff;border-radius:16px;padding:4px;margin-bottom:10px}
.tabs button{padding:9px 4px;border-radius:12px;font-size:13px;font-weight:900;color:#6a5a99}
.tabs button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 3px 10px #4a318c22}
.pane{min-height:118px}
.row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 13px;border-radius:14px;background:#f5f1ff;border:2px solid #ece4ff;font-size:12.5px;font-weight:850;color:#5b4c8c;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.lay{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px}
.lay i{display:block;width:30px;height:38px;border-radius:6px;background:#d9cdfc;position:relative;overflow:hidden}
.chip[aria-pressed=true] .lay i,.chip[aria-pressed=true] i{background:#8f78e6}
.lay i::before,.lay i::after{content:"";position:absolute;background:#fff}
.lay .l-real::before{left:3px;top:3px;width:11px;height:14px;border-radius:3px;border:1.5px solid #2a1d55}
.lay .l-side::before{left:14px;top:0;width:2px;height:100%}
.lay .l-stack::before{top:18px;left:0;height:2px;width:100%}
.hint{font-size:11.5px;color:#7a6c9e;margin:7px 2px 0;line-height:1.5}
.chars{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chars::-webkit-scrollbar{display:none}
.ch{flex:none;width:72px;border-radius:18px;background:#fbf8ff;border:2px solid #efe7ff;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.ch img{width:50px;height:50px;object-fit:contain;pointer-events:none}
.ch b{font-size:10px;color:#5b4c8c;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .n{position:absolute;top:-4px;right:-2px;background:var(--pink2);color:#fff;font-size:10px;font-weight:900;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.sel-tools{display:flex;align-items:center;gap:8px;margin-top:8px}
.sel-tools label{flex:1;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:850;color:#5b4c8c}
.sel-tools input{flex:1;accent-color:var(--pink2);min-width:0}
.mini{padding:8px 10px;border-radius:12px;background:#f5f1ff;font-size:12px;font-weight:900;color:#5b4c8c;flex:none}
.mini.del{background:#ffe8f1;color:#d03a7a}
.styles{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.styles::-webkit-scrollbar{display:none}
.sty{flex:none;min-width:76px;height:46px;border-radius:14px;background:#2f2160;border:2px solid transparent;display:grid;place-items:center;padding:0 8px}
.sty[aria-pressed=true]{border-color:var(--pink2);box-shadow:0 0 0 2px #ffd0e4}
.sty span{font-size:17px;color:#fff;-webkit-text-stroke:4px #2a1d55;paint-order:stroke fill}
.sty img{height:26px}
.dots{display:flex;gap:8px;margin-top:8px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3dafa}
.dot[aria-pressed=true]{box-shadow:0 0 0 3px var(--pink2)}
.bar-edit{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:10px 0 max(14px,calc(env(safe-area-inset-bottom) + 6px));align-items:center}
.bar-edit .round{width:60px;height:52px;border-radius:18px;background:#f2ecff;color:var(--ink);font-size:10px;white-space:nowrap}
.bar-edit .round .i{font-size:19px}
.save{height:52px;border-radius:18px;background:linear-gradient(180deg,#ff8cc2,#ff4f97);color:#fff;font-size:16px;font-weight:950;box-shadow:0 5px 0 #c23a79;letter-spacing:.5px}
.save:active{transform:translateY(3px);box-shadow:0 2px 0 #c23a79}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a1d55ee;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.saved{position:fixed;inset:0;background:#140c2de8;z-index:30;display:grid;place-items:center;padding:16px}
.saved-box{background:#fff;color:var(--ink);border-radius:22px;padding:12px;max-width:430px;width:100%;max-height:94vh;overflow:auto}
.saved-box img{width:100%;display:block;border-radius:14px;-webkit-touch-callout:default;user-select:auto}
.saved-tip{font-size:12.5px;color:#5b4c80;text-align:center;line-height:1.6;margin:10px 4px}
.saved-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved-btns button{height:48px;border-radius:15px;font-weight:900;background:#f2ecff;color:var(--ink)}
.saved-btns .p{background:linear-gradient(180deg,#ff8cc2,#ff4f97);color:#fff}
.tabs{grid-template-columns:repeat(4,1fr)}
.tabs button{font-size:12px;padding:9px 2px}
.lay i.l-wave::before{left:0;top:15px;width:100%;height:8px;background:none;border-top:3px solid #fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.lay i.l-vwave::before{top:0;left:12px;height:100%;width:8px;background:none;border-left:3px solid #fff;border-radius:50% 0 0 50%/100% 0 0 100%}
.lay i.l-zig::before{left:-4px;top:16px;width:40px;height:3px;transform:rotate(-28deg)}
.lay i.l-one{}
.lay i.l-hcut::before{left:0;top:18px;width:100%;height:2px;background:#2a1d55;opacity:.35}
.lay i.l-vcut::before{top:0;left:14px;height:100%;width:2px;background:#2a1d55;opacity:.35}
.aspect{display:flex;gap:7px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.aspect .chip{display:flex;align-items:center;gap:6px}
.aspect .chip i{display:inline-block;border:2px solid currentColor;border-radius:3px}
.sty.none span{font-size:13px;-webkit-text-stroke:0;color:#fff;font-weight:900}
.tools2{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>

<!-- ① 撮影 -->
<section class="scr" id="scrCam">
  <div class="bar-top">
    <div class="logo-mini">コツンズ<small>じどり</small></div>
    <div class="chip-toggle" role="group" aria-label="撮りかた">
      <button id="m2" aria-pressed="true">内＋外 2枚</button><button id="m1" aria-pressed="false">1枚</button>
    </div>
  </div>
  <div class="finder-wrap"><div class="finder" id="finder">
    <video id="video" playsinline autoplay muted></video>
    <div class="msg" id="camMsg">カメラを起動しています…</div>
    <div class="pill" id="camPill">内カメ</div>
    <div class="inset hidden" id="inset"></div>
    <div class="count hidden" id="count"></div>
    <div class="flash" id="flash"></div>
  </div></div>
  <div class="under"><button class="linkish" id="pickBtn">アルバムから写真をえらぶ</button></div>
  <div class="bar-bottom">
    <button class="round home" id="homeCam" aria-label="ホームにもどる"><span class="i">🏠</span>ホーム</button>
    <button class="shutter" id="shutter" aria-label="撮影"><span></span></button>
    <button class="round flip" id="flip" aria-label="内カメと外カメを切りかえ"><span class="i">🔄</span>切替</button>
  </div>
  <input type="file" id="file" accept="image/*" multiple class="hidden">
</section>

<!-- ② 仕上げ -->
<section class="scr hidden" id="scrEdit">
  <div class="edit-top"><div class="logo-mini">コツンズ<small>デコって保存</small></div></div>
  <div class="stage"><canvas id="cv" width="1080" height="1440" role="img" aria-label="できあがりの写真"></canvas></div>
  <div class="panel">
    <div class="tabs" role="tablist">
      <button data-tab="lay" aria-pressed="true">🖼 形</button><button data-tab="pho" aria-pressed="false">🔄 写真</button><button data-tab="chr" aria-pressed="false">🧸 キャラ</button><button data-tab="logo" aria-pressed="false">✨ ロゴ</button>
    </div>
    <div class="pane" id="pane-lay">
      <div class="row" id="layRow">
<button class="chip lay" data-lay="hcut" aria-pressed="true"><i class="l-hcut"></i>上下</button>
<button class="chip lay" data-lay="vcut" aria-pressed="false"><i class="l-vcut"></i>左右</button>
<button class="chip lay" data-lay="wave" aria-pressed="false"><i class="l-wave"></i>なみなみ</button>
<button class="chip lay" data-lay="vwave" aria-pressed="false"><i class="l-vwave"></i>ゆらゆら</button>
<button class="chip lay" data-lay="zig" aria-pressed="false"><i class="l-zig"></i>コツン！</button>
<button class="chip lay" data-lay="one" aria-pressed="false"><i class="l-one"></i>1枚</button>
        <button class="chip" id="swap">⇄ 入れかえ</button>
        <button class="chip" id="sparkBtn" aria-pressed="true">💥 コツン</button>
      </div>
      <div class="aspect" id="aspRow">
        <button class="chip" data-asp="34" aria-pressed="true"><i style="width:12px;height:16px"></i>たて</button>
        <button class="chip" data-asp="11" aria-pressed="false"><i style="width:14px;height:14px"></i>四角</button>
        <button class="chip" data-asp="916" aria-pressed="false"><i style="width:10px;height:17px"></i>ストーリー</button>
        <button class="chip" data-asp="43" aria-pressed="false"><i style="width:16px;height:12px"></i>よこ</button>
      </div>
      <div class="sel-tools" id="sparkTools"><label>💥 コツンの大きさ<input type="range" id="spSize" min="50" max="180" value="100"></label></div>
      <p class="hint">「上下」「左右」はまっすぐ（すきまなし）。「なみなみ」「ゆらゆら」「コツン！」は、2枚がコツンとくっつく形です。写真は指で動かして、2本指で拡大できます。</p>
    </div>
    <div class="pane hidden" id="pane-pho">
      <div class="row" id="phoWho">
        <button class="chip" data-who="user" aria-pressed="true">🤳 内カメ</button>
        <button class="chip" data-who="environment" aria-pressed="false">🌄 外カメ</button>
      </div>
      <div class="tools2">
        <button class="mini" id="rotL">⟲ 左に回す</button>
        <button class="mini" id="rotR">⟳ 右に回す</button>
        <button class="mini" id="phFlip">↔ 反転</button>
        <button class="mini" id="phReset">もとにもどす</button>
      </div>
      <div class="sel-tools"><label>大きさ<input type="range" id="phZoom" min="100" max="400" value="100"></label></div>
      <p class="hint">写真の上をドラッグすると、うつる場所を動かせます。</p>
    </div>
    <div class="pane hidden" id="pane-chr">
      <div class="chars" id="chars"></div>
      <div class="sel-tools" id="stTools">
        <label>大きさ<input type="range" id="stSize" min="10" max="80" value="34"></label>
        <button class="mini" id="stFlip">↔ 反転</button>
        <button class="mini del" id="stDel">けす</button>
      </div>
      <p class="hint" id="chrHint">タップでキャラを追加（6体まで）。写真の上でドラッグ、2本指で大きさと向き。</p>
    </div>
    <div class="pane hidden" id="pane-logo">
      <div class="styles" id="styles"></div>
      <div id="logoOpts">
        <div class="dots" id="colors"></div>
        <div class="sel-tools"><label>大きさ<input type="range" id="lgSize" min="70" max="180" value="100"></label></div>
        <div class="row" style="margin-top:8px" id="lgPos">
          <button class="chip" data-pos="top">上</button><button class="chip" data-pos="mid">まん中</button><button class="chip" data-pos="bottom">下</button><button class="chip" data-pos="tl">左上</button><button class="chip" data-pos="br">右下</button>
        </div>
      </div>
      <p class="hint" id="logoHint">ロゴは写真の上でドラッグしても動かせます。</p>
    </div>
    <div class="bar-edit">
      <button class="round" id="homeEdit" aria-label="ホームにもどる"><span class="i">🏠</span>ホーム</button>
      <button class="round" id="retake" aria-label="撮りなおす"><span class="i">📷</span>撮り直す</button>
      <button class="save" id="saveBtn">保存する</button>
    </div>
  </div>
</section>

<div class="saved hidden" id="saved" role="dialog" aria-modal="true" aria-label="できあがった写真">
  <div class="saved-box">
    <img id="savedImg" alt="できあがった写真">
    <p class="saved-tip" id="savedTip"></p>
    <div class="saved-btns"><button id="savedClose">とじる</button><button class="p" id="savedShare">共有・保存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// 写真はこのページの中（スマホの中）だけで合成する。サーバーには送らない
const $ = id => document.getElementById(id);
// [id, 名前, 絵]。表紙の2体は、表紙の絵（assets/ui/title.webp）から切りぬいたもの
const CHARS = [["title-blue","表紙のあお","assets/selfie/title-blue.webp"],["title-yellow","表紙のきいろ","assets/selfie/title-yellow.webp"],
  ...[["k001","ぬけもん"],["k002","めだまる"],["k003","ロジポン"],["k006","ムキッツ"],["k007","ウロット"],["k008","クエス"],["k009","ホコリィ"]].map(([id, n]) => [id, n, "assets/characters/" + id + "/stage-1.webp"])];
const charSrc = id => (CHARS.find(c => c[0] === id) || [])[2];
const MAX_STICKERS = 6;
const ASPECTS = { "34": [1080, 1440], "11": [1080, 1080], "916": [1080, 1920], "43": [1440, 1080] };
const LOGO_STYLES = [
  { id: "none", label: "なし" },
  { id: "official", label: "公式" },
  { id: "pop", label: "ぷっくり", font: "KZ Pop" },
  { id: "hand", label: "てがき", font: "KZ Hand" },
  { id: "bold", label: "どっしり", font: "KZ Bold" },
];
const LOGO_COLORS = [
  { id: "white", fill: ["#ffffff", "#f3ecff"], stroke: "#2a1d55" },
  { id: "pink", fill: ["#ffd1e6", "#ff5fa8"], stroke: "#4b1238" },
  { id: "sun", fill: ["#fff6a8", "#ffbf1a"], stroke: "#4a2a00" },
  { id: "sky", fill: ["#e4f6ff", "#59b8ff"], stroke: "#13305a" },
];
const blankView = () => ({ ox: 0, oy: 0, z: 1, rot: 0, flip: false });
const S = {
  shots: 2, facing: "user", stream: null, busy: false,
  raw: { user: null, environment: null },                  // 撮ったままの写真（canvas）
  photos: { user: null, environment: null },               // 回転・反転したあとの写真
  view: { user: blankView(), environment: blankView() },   // 写真の向き・大きさ・見える場所
  who: "user", lay: "wave", asp: "34", swap: false,
  spark: { on: true, x: .5, y: .5, s: 1 },                 // 2枚がくっつく所の「コツン」
  stickers: [], sel: null,                                  // sel: "logo" | "spark" | sticker
  logo: { style: "pop", color: "white", s: 1, x: .5, y: .1 },
  imgs: {}, logoImg: null,
};
const video = $("video"), cv = $("cv"), cx = cv.getContext("2d");
const NAME = { user: "内カメ", environment: "外カメ" };
const other = f => f === "user" ? "environment" : "user";
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT = 0;
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 2000); }
function goHome(){ stopCam(); location.href = "./index.html?notitle=1"; }

// =============== カメラ ===============
function stopCam(){ if(S.stream){ S.stream.getTracks().forEach(t => t.stop()); S.stream = null; } video.srcObject = null; }
async function startCam(facing){
  stopCam(); S.facing = facing; $("camPill").textContent = NAME[facing]; video.classList.toggle("mirror", facing === "user");
  $("camMsg").textContent = "カメラを起動しています…"; $("camMsg").classList.remove("hidden");
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) throw new Error("no camera");

  }else if(ps.length === 2 && drag){
    const [a, b] = ps; drag.d0 = Math.hypot(a.x - b.x, a.y - b.y); drag.a0 = Math.atan2(b.y - a.y, b.x - a.x);
    const o = drag.obj; drag.base = drag.kind === "pan" ? { z: S.view[drag.slot.k].z } : o === "logo" ? { s: S.logo.s } : o === "spark" ? { s: S.spark.s } : { w: o.w, rot: o.rot };
  }
  render();
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, toCv(e)); startGesture(); });
cv.addEventListener("pointermove", e => {
  if(!pts.has(e.pointerId) || !drag) return; pts.set(e.pointerId, toCv(e)); const ps = [...pts.values()], W = cv.width, H = cv.height;
  if(ps.length >= 2 && drag.d0){
    const [a, b] = ps, k = Math.hypot(a.x - b.x, a.y - b.y) / drag.d0, da = Math.atan2(b.y - a.y, b.x - a.x) - drag.a0, o = drag.obj;
    if(drag.kind === "pan"){ S.view[drag.slot.k].z = Math.max(1, Math.min(4, drag.base.z * k)); syncPhotoTab(); }
    else if(o === "logo") S.logo.s = Math.max(.7, Math.min(1.8, drag.base.s * k));
    else if(o === "spark"){ S.spark.s = Math.max(.5, Math.min(1.8, drag.base.s * k)); $("spSize").value = Math.round(S.spark.s * 100); }
    else { o.w = Math.max(.1, Math.min(.8, drag.base.w * k)); o.rot = drag.base.rot + da; }
    syncTools(); render(); return;
  }
  const p = ps[0], dx = p.x - drag.last.x, dy = p.y - drag.last.y; drag.last = p;
  if(drag.kind === "pan"){ const s = drag.slot, img = S.photos[s.k]; if(img){ const v = S.view[s.k], k = Math.max(s.w / img.width, s.h / img.height) * v.z; v.ox -= dx / k; v.oy -= dy / k; } }
  else if(drag.obj === "logo"){ S.logo.x += dx / W; S.logo.y += dy / H; }
  else if(drag.obj === "spark"){ S.spark.x = Math.max(.05, Math.min(.95, S.spark.x + dx / W)); S.spark.y = Math.max(.05, Math.min(.95, S.spark.y + dy / H)); }
  else { const o = drag.obj; o.x = Math.max(0, Math.min(1, o.x + dx / W)); o.y = Math.max(0, Math.min(1, o.y + dy / H)); }
  render();
});
const endPt = e => { pts.delete(e.pointerId); if(pts.size === 0) drag = null; else if(drag){ drag.d0 = 0; drag.last = [...pts.values()][0]; } };
cv.addEventListener("pointerup", endPt); cv.addEventListener("pointercancel", endPt);

// ----- パネル -----
function showTab(t){ document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === t))); ["lay", "pho", "chr", "logo"].forEach(k => $("pane-" + k).classList.toggle("hidden", k !== t)); }
function showTabFor(h){ if(h === "logo") showTab("logo"); else if(h === "spark") showTab("lay"); else if(h) showTab("chr"); }
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
document.querySelectorAll("[data-lay]").forEach(b => b.addEventListener("click", () => setLay(b.dataset.lay, false)));
document.querySelectorAll("[data-asp]").forEach(b => b.addEventListener("click", () => { S.asp = b.dataset.asp; document.querySelectorAll("[data-asp]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); resize(false); }));
$("swap").addEventListener("click", () => { S.swap = !S.swap; render(); });
$("sparkBtn").addEventListener("click", () => { S.spark.on = !S.spark.on; $("sparkBtn").setAttribute("aria-pressed", String(S.spark.on)); S.sel = S.spark.on ? "spark" : null; syncSpark(); render(); });
function syncSpark(){ $("sparkTools").classList.toggle("hidden", !sparkOn()); $("spSize").value = Math.round(S.spark.s * 100); }
$("spSize").addEventListener("input", e => { S.spark.s = +e.target.value / 100; S.sel = "spark"; render(); });
// 写真の向き・大きさ
function syncPhotoTab(){
  const list = photoList(); if(!list.includes(S.who)) S.who = list[0] || "user";
  $("phoWho").classList.toggle("hidden", list.length < 2);
  document.querySelectorAll("[data-who]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.who === S.who)));
  $("phZoom").value = Math.round(S.view[S.who].z * 100);
}
document.querySelectorAll("[data-who]").forEach(b => b.addEventListener("click", () => { S.who = b.dataset.who; syncPhotoTab(); }));
const rotate = d => { const v = S.view[S.who]; v.rot = (v.rot + d + 360) % 360; v.ox = v.oy = 0; bake(S.who); render(); };
$("rotL").addEventListener("click", () => rotate(-90)); $("rotR").addEventListener("click", () => rotate(90));
$("phFlip").addEventListener("click", () => { const v = S.view[S.who]; v.flip = !v.flip; bake(S.who); render(); });
$("phReset").addEventListener("click", () => { S.view[S.who] = blankView(); bake(S.who); syncPhotoTab(); render(); });
$("phZoom").addEventListener("input", e => { S.view[S.who].z = +e.target.value / 100; render(); });
function drawChars(){
  const box = $("chars"); box.replaceChildren();
  for(const [id, name, src] of CHARS){
    const b = document.createElement("button"); b.className = "ch"; b.type = "button";
    const im = document.createElement("img"); im.src = src; im.alt = name; im.loading = "lazy";
    const nb = document.createElement("b"); nb.textContent = name; b.append(im, nb);
    const n = S.stickers.filter(s => s.id === id).length; if(n){ const c = document.createElement("span"); c.className = "n"; c.textContent = n; b.append(c); }
    b.addEventListener("click", () => addSticker(id)); box.append(b);
  }
}
function syncTools(){
  const st = S.stickers.includes(S.sel) ? S.sel : null;
  $("stTools").classList.toggle("hidden", !st);
  if(st) $("stSize").value = Math.round(st.w * 100);
  $("lgSize").value = Math.round(S.logo.s * 100);
}
$("stSize").addEventListener("input", e => { if(S.stickers.includes(S.sel)){ S.sel.w = +e.target.value / 100; render(); } });
$("stFlip").addEventListener("click", () => { if(S.stickers.includes(S.sel)){ S.sel.flip = !S.sel.flip; render(); } });
$("stDel").addEventListener("click", () => { const i = S.stickers.indexOf(S.sel); if(i >= 0){ S.stickers.splice(i, 1); S.sel = null; syncTools(); render(); drawChars(); } });
function drawStyles(){
  const box = $("styles"); box.replaceChildren();
  for(const s of LOGO_STYLES){
    const b = document.createElement("button"); b.className = "sty" + (s.id === "none" ? " none" : ""); b.type = "button"; b.setAttribute("aria-pressed", String(S.logo.style === s.id)); b.setAttribute("aria-label", "ロゴ " + s.label);
    if(s.id === "none"){ const sp = document.createElement("span"); sp.textContent = "ロゴなし"; b.append(sp); }
    else if(s.id === "official"){ const im = document.createElement("img"); im.src = "assets/ui/logo_light.webp"; im.alt = ""; b.append(im); }
    else { const sp = document.createElement("span"); sp.textContent = "コツンズ"; sp.style.fontFamily = "'" + s.font + "'"; b.append(sp); }
    b.addEventListener("click", () => { S.logo.style = s.id; S.sel = s.id === "none" ? null : "logo"; drawStyles(); render(); }); box.append(b);
  }
  $("logoOpts").classList.toggle("hidden", !logoOn());
  $("logoHint").textContent = logoOn() ? "ロゴは写真の上でドラッグしても動かせます。" : "ロゴを入れずに保存します。";
  const cb = $("colors"); cb.replaceChildren(); cb.classList.toggle("hidden", S.logo.style === "official");
  for(const c of LOGO_COLORS){ const d = document.createElement("button"); d.className = "dot"; d.type = "button"; d.style.background = "linear-gradient(180deg," + c.fill[0] + "," + c.fill[1] + ")"; d.setAttribute("aria-pressed", String(S.logo.color === c.id)); d.setAttribute("aria-label", "ロゴの色"); d.addEventListener("click", () => { S.logo.color = c.id; S.sel = "logo"; drawStyles(); render(); }); cb.append(d); }
}
$("lgSize").addEventListener("input", e => { S.logo.s = +e.target.value / 100; S.sel = "logo"; render(); });
document.querySelectorAll("[data-pos]").forEach(b => b.addEventListener("click", () => { placeLogo(b.dataset.pos); S.sel = "logo"; render(); }));

// ----- 保存・共有 -----
let saved = { url: null, blob: null, name: "" };
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function exportBlob(){ const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height; drawAll(c.getContext("2d"), true); return new Promise(r => c.toBlob(r, "image/png")); }
function canShareFile(blob, name){ try{ return !!(navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: "image/png" })] })); }catch(e){ return false; } }
async function save(){
  const blob = await exportBlob(); if(!blob){ toast("保存できませんでした"); return; }
  const name = "KOTSUNZ_" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".png";
  if(saved.url) URL.revokeObjectURL(saved.url); saved = { url: URL.createObjectURL(blob), blob, name };
  if(isIOS()){
    // iPhone は「ダウンロード」だとファイルアプリに入るので、写真アプリに入れられる画面を出す
    const sh = canShareFile(blob, name); $("savedImg").src = saved.url; $("savedShare").classList.toggle("hidden", !sh);
    $("savedTip").textContent = sh ? "「共有・保存」から「画像を保存」で写真アプリに入ります。写真を長押ししても保存できます。" : "写真を長押しして「“写真”に保存」をえらんでね。";
    $("saved").classList.remove("hidden"); return;
  }
  const a = document.createElement("a"); a.href = saved.url; a.download = name; document.body.append(a); a.click(); a.remove();
  toast("保存しました！");
}
$("saveBtn").addEventListener("click", save);
$("savedClose").addEventListener("click", () => $("saved").classList.add("hidden"));
$("savedShare").addEventListener("click", async () => { try{ await navigator.share({ title: "コツンズ", files: [new File([saved.blob], saved.name, { type: "image/png" })] }); }catch(e){} });

// ----- 撮影画面のボタン -----
$("shutter").addEventListener("click", shoot);
$("flip").addEventListener("click", () => { if(!S.busy) startCam(other(S.facing)); });
$("homeCam").addEventListener("click", goHome); $("homeEdit").addEventListener("click", goHome);
$("retake").addEventListener("click", () => { $("scrEdit").classList.add("hidden"); $("scrCam").classList.remove("hidden"); startCam(S.shots === 2 ? "user" : S.facing); });
$("pickBtn").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => { fromFiles(e.target.files || []); e.target.value = ""; });
const setShots = n => { S.shots = n; $("m2").setAttribute("aria-pressed", String(n === 2)); $("m1").setAttribute("aria-pressed", String(n === 1)); toast(n === 2 ? "内カメ→外カメの順に2枚とるよ" : "1枚だけとるよ"); };
$("m2").addEventListener("click", () => setShots(2)); $("m1").addEventListener("click", () => setShots(1));
window.addEventListener("pagehide", stopCam);
document.addEventListener("visibilitychange", () => { if(document.hidden) stopCam(); else if(!$("scrCam").classList.contains("hidden")) startCam(S.facing); });
window.addEventListener("resize", fitFinder);

// ----- はじめ -----
(async () => {
  fitFinder(); drawChars(); drawStyles(); syncTools();
  loadImg("assets/ui/logo_light.webp").then(i => { S.logoImg = i; render(); }).catch(() => {});
  try{ await Promise.all(["KZ Pop", "KZ Hand", "KZ Bold"].map(f => document.fonts.load("40px '" + f + "'", "コツンズ"))); }catch(e){}
  drawStyles(); render();
  startCam("user");
})();
</script>
