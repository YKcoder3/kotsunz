<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1233">
<title>コツンズ自撮り | コツンズ</title>
<style>
/* かわいいロゴ用のフォント（カタカナだけに小さくしたもの。SIL Open Font License 1.1） */
@font-face{font-family:"KZ Pop";src:url("assets/fonts/mochiy-pop-one-katakana.woff2") format("woff2");font-display:block}
@font-face{font-family:"KZ Hand";src:url("assets/fonts/hachi-maru-pop-katakana.woff2") format("woff2");font-display:block}
@font-face{font-family:"KZ Bold";src:url("assets/fonts/dela-gothic-one-katakana.woff2") format("woff2");font-display:block}
:root{--ink:#2a1d55;--pink:#ff6fae;--pink2:#ff4f97;--violet:#6f48d8;--sky:#7cc8ff;--sun:#ffd54a;--bg1:#1b1233;--bg2:#33205f;font-family:system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg1);color:#fff;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}
.hidden{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#4b2f86 0%,var(--bg1) 62%)}
/* 上の小さなバー */
.bar-top{display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 14px 6px;min-height:52px}
.logo-mini{font-family:"KZ Pop",system-ui;font-size:22px;color:#fff;-webkit-text-stroke:5px #2a1d55;paint-order:stroke fill;letter-spacing:.5px;text-shadow:0 3px 0 #ff6fae}
.logo-mini small{font-family:system-ui;font-size:11px;font-weight:800;-webkit-text-stroke:0;text-shadow:none;color:#ffd6ea;margin-left:6px;vertical-align:middle}
.chip-toggle{display:flex;background:#ffffff1f;border-radius:999px;padding:3px}
.chip-toggle button{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:850;color:#e9defd}
.chip-toggle button[aria-pressed=true]{background:#fff;color:var(--ink)}
/* ファインダー */
.finder-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0}
.finder{position:relative;width:300px;height:400px;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 0 0 3px #ffffff22,0 18px 40px #0008}
.finder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder video.mirror{transform:scaleX(-1)}
.finder .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.8;color:#e6dcff}
.finder .pill{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#00000070;backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:850}
.finder .inset{position:absolute;top:12px;left:12px;width:28%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 14px #0007;background:#222}
.finder .inset canvas{width:100%;height:100%;object-fit:cover;display:block}
.finder .count{position:absolute;inset:0;display:grid;place-items:center;font-family:"KZ Pop",system-ui;font-size:110px;color:#fff;-webkit-text-stroke:8px #2a1d55;paint-order:stroke fill;text-shadow:0 8px 0 #ff6fae;pointer-events:none}
.finder .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.finder .flash.on{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
/* 下のバー（親指でとどく位置） */
.bar-bottom{padding:10px 18px max(16px,calc(env(safe-area-inset-bottom) + 8px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.round{width:58px;height:58px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1.1;text-align:center}
.round .i{font-size:22px;display:block}
.round.home{justify-self:start}
.round.flip{justify-self:end}
.shutter{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px #ffffff40,0 0 0 9px #ff6fae;display:grid;place-items:center;transition:transform .1s}
.shutter:active{transform:scale(.92)}
.shutter span{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#ff9bc8,#ff4f97)}
.under{text-align:center;padding:0 0 4px}
.linkish{font-size:13px;font-weight:800;color:#ffd6ea;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
/* 編集 */
.edit-top{display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 12px 4px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px}
#cv{max-width:100%;max-height:100%;border-radius:18px;box-shadow:0 14px 36px #0009;touch-action:none;background:#2a1d55;display:block}
.panel{background:#fff;color:var(--ink);border-radius:26px 26px 0 0;padding:10px 14px 0;box-shadow:0 -8px 30px #0005}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f2ecff;border-radius:16px;padding:4px;margin-bottom:10px}
.tabs button{padding:9px 4px;border-radius:12px;font-size:13px;font-weight:900;color:#6a5a99}
.tabs button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 3px 10px #4a318c22}
.pane{min-height:118px}
.row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 13px;border-radius:14px;background:#f5f1ff;border:2px solid #ece4ff;font-size:12.5px;font-weight:850;color:#5b4c8c;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.lay{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px}
.lay i{display:block;width:30px;height:38px;border-radius:6px;background:#d9cdfc;position:relative;overflow:hidden}
.chip[aria-pressed=true] .lay i,.chip[aria-pressed=true] i{background:#8f78e6}
.lay i::before,.lay i::after{content:"";position:absolute;background:#fff}
.lay .l-real::before{left:3px;top:3px;width:11px;height:14px;border-radius:3px;border:1.5px solid #2a1d55}
.lay .l-side::before{left:14px;top:0;width:2px;height:100%}
.lay .l-stack::before{top:18px;left:0;height:2px;width:100%}
.hint{font-size:11.5px;color:#7a6c9e;margin:7px 2px 0;line-height:1.5}
.chars{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chars::-webkit-scrollbar{display:none}
.ch{flex:none;width:72px;border-radius:18px;background:#fbf8ff;border:2px solid #efe7ff;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.ch img{width:50px;height:50px;object-fit:contain;pointer-events:none}
.ch b{font-size:10px;color:#5b4c8c;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .n{position:absolute;top:-4px;right:-2px;background:var(--pink2);color:#fff;font-size:10px;font-weight:900;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.sel-tools{display:flex;align-items:center;gap:8px;margin-top:8px}
.sel-tools label{flex:1;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:850;color:#5b4c8c}
.sel-tools input{flex:1;accent-color:var(--pink2);min-width:0}
.mini{padding:8px 10px;border-radius:12px;background:#f5f1ff;font-size:12px;font-weight:900;color:#5b4c8c;flex:none}
.mini.del{background:#ffe8f1;color:#d03a7a}
.styles{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.styles::-webkit-scrollbar{display:none}
.sty{flex:none;min-width:76px;height:46px;border-radius:14px;background:#2f2160;border:2px solid transparent;display:grid;place-items:center;padding:0 8px}
.sty[aria-pressed=true]{border-color:var(--pink2);box-shadow:0 0 0 2px #ffd0e4}
.sty span{font-size:17px;color:#fff;-webkit-text-stroke:4px #2a1d55;paint-order:stroke fill}
.sty img{height:26px}
.dots{display:flex;gap:8px;margin-top:8px;align-items:center}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3dafa}
.dot[aria-pressed=true]{box-shadow:0 0 0 3px var(--pink2)}
.bar-edit{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:10px 0 max(14px,calc(env(safe-area-inset-bottom) + 6px));align-items:center}
.bar-edit .round{width:60px;height:52px;border-radius:18px;background:#f2ecff;color:var(--ink);font-size:10px;white-space:nowrap}
.bar-edit .round .i{font-size:19px}
.save{height:52px;border-radius:18px;background:linear-gradient(180deg,#ff8cc2,#ff4f97);color:#fff;font-size:16px;font-weight:950;box-shadow:0 5px 0 #c23a79;letter-spacing:.5px}
.save:active{transform:translateY(3px);box-shadow:0 2px 0 #c23a79}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a1d55ee;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.saved{position:fixed;inset:0;background:#140c2de8;z-index:30;display:grid;place-items:center;padding:16px}
.saved-box{background:#fff;color:var(--ink);border-radius:22px;padding:12px;max-width:430px;width:100%;max-height:94vh;overflow:auto}
.saved-box img{width:100%;display:block;border-radius:14px;-webkit-touch-callout:default;user-select:auto}
.saved-tip{font-size:12.5px;color:#5b4c80;text-align:center;line-height:1.6;margin:10px 4px}
.saved-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved-btns button{height:48px;border-radius:15px;font-weight:900;background:#f2ecff;color:var(--ink)}
.saved-btns .p{background:linear-gradient(180deg,#ff8cc2,#ff4f97);color:#fff}
</style>
</head>
<body>

<!-- ① 撮影 -->
<section class="scr" id="scrCam">
  <div class="bar-top">
    <div class="logo-mini">コツンズ<small>じどり</small></div>
    <div class="chip-toggle" role="group" aria-label="撮りかた">
      <button id="m2" aria-pressed="true">内＋外 2枚</button><button id="m1" aria-pressed="false">1枚</button>
    </div>
  </div>
  <div class="finder-wrap"><div class="finder" id="finder">
    <video id="video" playsinline autoplay muted></video>
    <div class="msg" id="camMsg">カメラを起動しています…</div>
    <div class="pill" id="camPill">内カメ</div>
    <div class="inset hidden" id="inset"></div>
    <div class="count hidden" id="count"></div>
    <div class="flash" id="flash"></div>
  </div></div>
  <div class="under"><button class="linkish" id="pickBtn">アルバムから写真をえらぶ</button></div>
  <div class="bar-bottom">
    <button class="round home" id="homeCam" aria-label="ホームにもどる"><span class="i">🏠</span>ホーム</button>
    <button class="shutter" id="shutter" aria-label="撮影"><span></span></button>
    <button class="round flip" id="flip" aria-label="内カメと外カメを切りかえ"><span class="i">🔄</span>切替</button>
  </div>
  <input type="file" id="file" accept="image/*" multiple class="hidden">
</section>

<!-- ② 仕上げ -->
<section class="scr hidden" id="scrEdit">
  <div class="edit-top"><div class="logo-mini">コツンズ<small>デコって保存</small></div></div>
  <div class="stage"><canvas id="cv" width="1080" height="1440" role="img" aria-label="できあがりの写真"></canvas></div>
  <div class="panel">
    <div class="tabs" role="tablist">
      <button data-tab="lay" aria-pressed="true">🖼 レイアウト</button><button data-tab="chr" aria-pressed="false">🧸 キャラ</button><button data-tab="logo" aria-pressed="false">✨ ロゴ</button>
    </div>
    <div class="pane" id="pane-lay">
      <div class="row" id="layRow">
        <button class="chip lay" data-lay="real" aria-pressed="true"><i class="l-real"></i>ビーリアル風</button>
        <button class="chip lay" data-lay="side" aria-pressed="false"><i class="l-side"></i>左右</button>
        <button class="chip lay" data-lay="stack" aria-pressed="false"><i class="l-stack"></i>上下</button>
        <button class="chip lay" data-lay="one" aria-pressed="false"><i></i>1枚</button>
        <button class="chip" id="swap">⇄ 入れかえ</button>
      </div>
      <p class="hint" id="layHint">写真を指で動かすと、うつる場所を変えられます。2本指で拡大もできます。</p>
    </div>
    <div class="pane hidden" id="pane-chr">
      <div class="chars" id="chars"></div>
      <div class="sel-tools" id="stTools">
        <label>大きさ<input type="range" id="stSize" min="10" max="80" value="34"></label>
        <button class="mini" id="stFlip">↔ 反転</button>
        <button class="mini del" id="stDel">けす</button>
      </div>
      <p class="hint" id="chrHint">タップでキャラを追加（6体まで）。写真の上でドラッグ、2本指で大きさと向き。</p>
    </div>
    <div class="pane hidden" id="pane-logo">
      <div class="styles" id="styles"></div>
      <div class="dots" id="colors"></div>
      <div class="sel-tools">
        <label>大きさ<input type="range" id="lgSize" min="70" max="180" value="100"></label>
      </div>
      <div class="row" style="margin-top:8px" id="lgPos">
        <button class="chip" data-pos="top">上</button><button class="chip" data-pos="mid">まん中</button><button class="chip" data-pos="bottom">下</button><button class="chip" data-pos="tl">左上</button><button class="chip" data-pos="br">右下</button>
      </div>
      <p class="hint">ロゴは写真の上でドラッグしても動かせます。「コツンズ」のロゴはどの写真にも入ります。</p>
    </div>
    <div class="bar-edit">
      <button class="round" id="homeEdit" aria-label="ホームにもどる"><span class="i">🏠</span>ホーム</button>
      <button class="round" id="retake" aria-label="撮りなおす"><span class="i">📷</span>撮りなおす</button>
      <button class="save" id="saveBtn">保存する</button>
    </div>
  </div>
</section>

<div class="saved hidden" id="saved" role="dialog" aria-modal="true" aria-label="できあがった写真">
  <div class="saved-box">
    <img id="savedImg" alt="コツンズのロゴ入りの写真">
    <p class="saved-tip" id="savedTip"></p>
    <div class="saved-btns"><button id="savedClose">とじる</button><button class="p" id="savedShare">共有・保存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// 写真はこのページの中（スマホの中）だけで合成する。サーバーには送らない
const $ = id => document.getElementById(id);
const CHARS = [["k001","ぬけもん"],["k002","めだまる"],["k003","ロジポン"],["k005","ルミュ"],["k006","ムキッツ"],["k007","ウロット"],["k008","クエス"],["k009","ホコリィ"]];
const MAX_STICKERS = 6;
const LOGO_STYLES = [
  { id: "official", label: "公式" },
  { id: "pop", label: "ぷっくり", font: "KZ Pop" },
  { id: "hand", label: "てがき", font: "KZ Hand" },
  { id: "bold", label: "どっしり", font: "KZ Bold" },
];
const LOGO_COLORS = [
  { id: "white", fill: ["#ffffff", "#f3ecff"], stroke: "#2a1d55", glow: "#ff6fae" },
  { id: "pink", fill: ["#ffd1e6", "#ff5fa8"], stroke: "#4b1238", glow: "#ffffff" },
  { id: "sun", fill: ["#fff6a8", "#ffbf1a"], stroke: "#4a2a00", glow: "#ff6fae" },
  { id: "sky", fill: ["#e4f6ff", "#59b8ff"], stroke: "#13305a", glow: "#ffffff" },
];
const S = {
  shots: 2, facing: "user", stream: null, busy: false,
  photos: { user: null, environment: null },               // 撮った写真（canvas）
  view: { user: { ox: 0, oy: 0, z: 1 }, environment: { ox: 0, oy: 0, z: 1 } },  // 写真の見える場所
  lay: "real", swap: false,
  inset: { x: .05, y: .04, w: .30 },                       // ビーリアル風の小さい写真
  stickers: [], sel: null,                                  // sel: "logo" | "inset" | sticker
  logo: { style: "pop", color: "white", s: 1, x: .5, y: .1 },
  imgs: {}, logoImg: null,
};
const video = $("video"), cv = $("cv"), cx = cv.getContext("2d");
const NAME = { user: "内カメ", environment: "外カメ" };
const other = f => f === "user" ? "environment" : "user";
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT = 0;
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("on"), 2000); }
function goHome(){ stopCam(); location.href = "./index.html?notitle=1"; }

// =============== カメラ ===============
function stopCam(){ if(S.stream){ S.stream.getTracks().forEach(t => t.stop()); S.stream = null; } video.srcObject = null; }
async function startCam(facing){
  stopCam(); S.facing = facing; $("camPill").textContent = NAME[facing]; video.classList.toggle("mirror", facing === "user");
  $("camMsg").textContent = "カメラを起動しています…"; $("camMsg").classList.remove("hidden");
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) throw new Error("no camera");
    // 解像度を縦横同じだけ大きく希望すると、切りとられていない「ふつうの画角」（多くは4:3）がえらばれる
    const st = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: facing }, width: { ideal: 4096 }, height: { ideal: 4096 } } });
    S.stream = st; video.srcObject = st; await video.play();
    const tr = st.getVideoTracks()[0];
    try{ const cap = tr.getCapabilities ? tr.getCapabilities() : {}; if(cap.zoom) await tr.applyConstraints({ advanced: [{ zoom: cap.zoom.min }] }); }catch(e){}   // ズームしている端末は、いちばん広く
    await new Promise(r => { if(video.videoWidth) r(); else video.onloadedmetadata = () => r(); });
    fitFinder(); $("camMsg").classList.add("hidden");
  }catch(e){
    $("camMsg").innerHTML = "カメラを使えませんでした。<br>カメラを「許可」にするか、<br>下の「アルバムから写真をえらぶ」を使ってね。";
  }
}
function fitFinder(){
  // ファインダーを、カメラの映像と同じ形にして、入るいちばん大きいサイズに（映像を切りとらない）
  const f = $("finder"), wrap = f.parentElement, ar = video.videoWidth ? video.videoWidth / video.videoHeight : 3 / 4;
  const W = wrap.clientWidth - 24, H = wrap.clientHeight - 12; let w = W, h = w / ar; if(h > H){ h = H; w = h * ar; }
  f.style.width = Math.floor(w) + "px"; f.style.height = Math.floor(h) + "px";
}
function grab(){
  // 映像をそのまま（切りとらずに）写真にする。長い辺は最大1920px
  const vw = video.videoWidth, vh = video.videoHeight; if(!vw) return null;
  const k = Math.min(1, 1920 / Math.max(vw, vh)), c = document.createElement("canvas");
  c.width = Math.round(vw * k); c.height = Math.round(vh * k); const g = c.getContext("2d");
  if(S.facing === "user"){ g.translate(c.width, 0); g.scale(-1, 1); }
  g.drawImage(video, 0, 0, c.width, c.height); return c;
}
function flash(){ const f = $("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); try{ navigator.vibrate && navigator.vibrate(20); }catch(e){} }
async function shoot(){
  if(S.busy) return; if(!S.stream || !video.videoWidth){ toast("カメラが使えないときは、アルバムからえらんでね"); return; }
  S.busy = true; $("shutter").disabled = true;
  try{
    const first = S.facing; const a = grab(); flash(); S.photos = { user: null, environment: null }; S.photos[first] = a;
    if(S.shots === 2){
      const ins = $("inset"); ins.replaceChildren(a.cloneNode()); ins.firstChild.getContext("2d").drawImage(a, 0, 0); ins.classList.remove("hidden");
      await startCam(other(first));
      for(const n of [3, 2, 1]){ $("count").textContent = n; $("count").classList.remove("hidden"); await sleep(650); }
      $("count").classList.add("hidden");
      const b = grab(); if(b){ flash(); S.photos[S.facing] = b; }
      await sleep(250); ins.classList.add("hidden");
    }
    openEditor(S.shots === 2 && S.photos.user && S.photos.environment ? "real" : "one");
  }finally{ S.busy = false; $("shutter").disabled = false; }
}
async function fromFiles(files){
  const list = [...files].slice(0, 2); if(!list.length) return;
  const toCanvas = f => new Promise((res, rej) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { const k = Math.min(1, 1920 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c); }; im.onerror = rej; im.src = u; });
  try{
    const cs = await Promise.all(list.map(toCanvas));
    S.photos = { user: cs[0], environment: cs[1] || null };
    if(!cs[1]){ S.photos = { user: null, environment: null }; S.photos[S.facing] = cs[0]; }

// =============== 仕上げ ===============
const photoList = () => ["user", "environment"].filter(k => S.photos[k]);
function openEditor(lay){

function setLay(lay, resetLogo){

  S.lay = lay;
  document.querySelectorAll("[data-lay]").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.lay === lay)); b.disabled = photoList().length < 2 && b.dataset.lay !== "one"; });
  const [W, H] = size(); cv.width = W; cv.height = H;

}
function size(){ return [1080, 1440]; }      // どのレイアウトも 3:4（ふつうの写真の形）
// どの写真をどこに置くか
function slots(){
  const W = cv.width, H = cv.height, list = photoList();
  const A = S.swap ? "environment" : "user", B = other(A);     // 左・上 = 内カメ（入れかえできる）
  if(S.lay === "one" || list.length < 2){ const k = list.length === 1 ? list[0] : (S.swap ? "user" : "environment"); return [{ k, x: 0, y: 0, w: W, h: H }]; }
  if(S.lay === "side") return [{ k: A, x: 0, y: 0, w: W / 2, h: H }, { k: B, x: W / 2, y: 0, w: W / 2, h: H }];
  if(S.lay === "stack") return [{ k: A, x: 0, y: 0, w: W, h: H / 2 }, { k: B, x: 0, y: H / 2, w: W, h: H / 2 }];

function srcRect(img, s){
  const v = S.view[s.k], iw = img.width, ih = img.height;
  const cover = Math.max(s.w / iw, s.h / ih) * v.z, sw = s.w / cover, sh = s.h / cover;

    const img = S.photos[s.k]; if(!img) continue;

}
// ----- キャラ -----
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function addSticker(id){
  if(S.stickers.length >= MAX_STICKERS){ toast("キャラは" + MAX_STICKERS + "体までだよ"); return; }
  try{ if(!S.imgs[id]) S.imgs[id] = await loadImg("assets/characters/" + id + "/stage-1.webp"); }catch(e){ toast("キャラの絵を読みこめませんでした"); return; }
  const n = S.stickers.length, st = { id, x: .7 - (n % 3) * .2, y: .74 - Math.floor(n / 3) * .2, w: .34, rot: 0, flip: false };

}
function stBox(st){ const W = cv.width, H = cv.height, im = S.imgs[st.id], w = st.w * W, h = w * im.naturalHeight / im.naturalWidth; return { cx: st.x * W, cy: st.y * H, w, h }; }
function drawSticker(g, st){
  const im = S.imgs[st.id]; if(!im) return; const b = stBox(st);

  g.shadowColor = "#1b0f3a66"; g.shadowBlur = 22; g.shadowOffsetY = 10; g.drawImage(im, -b.w / 2, -b.h / 2, b.w, b.h); g.restore();
}
// ----- ロゴ（必ず入る） -----
function logoMetrics(){
  const W = cv.width, st = S.logo.style;
  if(st === "official" && S.logoImg){ const w = W * .44 * S.logo.s; return { w, h: w * S.logoImg.naturalHeight / S.logoImg.naturalWidth }; }
  const f = Math.round(W * .118 * S.logo.s); cx.save(); cx.font = f + "px '" + fontOf(st) + "',system-ui"; const tw = cx.measureText("コツンズ").width; cx.restore();
  return { w: tw + f * .9, h: f * 1.35, f };
}
const fontOf = st => (LOGO_STYLES.find(x => x.id === st) || LOGO_STYLES[1]).font || "KZ Pop";
function clampLogo(){ const m = logoMetrics(), W = cv.width, H = cv.height; S.logo.x = Math.max(m.w / 2 / W, Math.min(1 - m.w / 2 / W, S.logo.x)); S.logo.y = Math.max(m.h / 2 / H, Math.min(1 - m.h / 2 / H, S.logo.y)); }
function placeLogo(pos){
  const m = logoMetrics(), W = cv.width, H = cv.height, mx = m.w / 2 / W + .03, my = m.h / 2 / H + .025;
  const P = { top: [.5, my], mid: [.5, .5], bottom: [.5, 1 - my - .02], tl: [mx, my], br: [1 - mx, 1 - my - .02] }[pos] || [.5, my];
  if(pos === "tl" && S.lay === "real") P[1] = S.inset.y + (S.inset.w * W * 4 / 3) / H + my + .01;   // 小さい写真とかさならないように

}
function star(g, x, y, r){ g.beginPath(); for(let i = 0; i < 8; i++){ const a = i * Math.PI / 4 - Math.PI / 2, rr2 = i % 2 ? r * .38 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } g.closePath(); }
function drawLogo(g){
  clampLogo(); const W = cv.width, H = cv.height, m = logoMetrics(), x = S.logo.x * W, y = S.logo.y * H;
  if(S.logo.style === "official" && S.logoImg){ g.save(); g.shadowColor = "#1b0f3a88"; g.shadowBlur = 18; g.shadowOffsetY = 6; g.drawImage(S.logoImg, x - m.w / 2, y - m.h / 2, m.w, m.h); g.restore(); return; }

  g.save(); g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round"; g.font = f + "px '" + fontOf(S.logo.style) + "',system-ui";
  const tx = x - f * .22;
  g.lineWidth = f * .42; g.strokeStyle = "#ffffff"; g.shadowColor = "#1b0f3a77"; g.shadowBlur = f * .25; g.shadowOffsetY = f * .1; g.strokeText("コツンズ", tx, y);   // シールみたいな白いふち
  g.shadowColor = "transparent";
  g.lineWidth = f * .22; g.strokeStyle = C.stroke; g.strokeText("コツンズ", tx, y);
  const gr = g.createLinearGradient(0, y - f / 2, 0, y + f / 2); gr.addColorStop(0, C.fill[0]); gr.addColorStop(1, C.fill[1]); g.fillStyle = gr; g.fillText("コツンズ", tx, y);

  star(g, sx, sy, f * .3); g.lineWidth = f * .12; g.strokeStyle = C.stroke; g.stroke(); g.fillStyle = "#ffd54a"; g.fill();
  star(g, sx + f * .12, sy + f * .55, f * .14); g.lineWidth = f * .07; g.stroke(); g.fillStyle = "#fff"; g.fill();
  g.restore();
}
function drawMark(g){ const W = cv.width, H = cv.height; g.save(); g.textAlign = "right"; g.font = "800 " + Math.round(W * .02) + "px system-ui,sans-serif"; g.lineWidth = 4; g.lineJoin = "round"; g.strokeStyle = "#2a1d55"; g.strokeText("KOTSUNZ", W * .97, H * .975); g.fillStyle = "#fff"; g.fillText("KOTSUNZ", W * .97, H * .975); g.restore(); }
function drawAll(g, forExport){
  drawPhotos(g); for(const st of S.stickers) drawSticker(g, st); drawLogo(g); drawMark(g);
  if(forExport || !S.sel) return;
  // えらんでいるものの枠（保存する写真には入らない）
  let b = null; const W = cv.width, H = cv.height;
  if(S.sel === "logo"){ const m = logoMetrics(); b = { cx: S.logo.x * W, cy: S.logo.y * H, w: m.w, h: m.h, rot: 0 }; }
  else if(S.sel === "inset"){ const s = slots()[1]; if(s) b = { cx: s.x + s.w / 2, cy: s.y + s.h / 2, w: s.w + 16, h: s.h + 16, rot: 0 }; }
  else if(S.stickers.includes(S.sel)){ const t = stBox(S.sel); b = { ...t, rot: S.sel.rot }; }
  if(!b) return;
  g.save(); g.translate(b.cx, b.cy); g.rotate(b.rot); g.setLineDash([18, 12]); g.lineWidth = 5; g.strokeStyle = "#ffffff"; g.shadowColor = "#ff4f97"; g.shadowBlur = 10; rr(g, -b.w / 2 - 8, -b.h / 2 - 8, b.w + 16, b.h + 16, 22); g.stroke(); g.restore();
}
let raf = 0;
function render(){ if(raf) return; raf = requestAnimationFrame(() => { raf = 0; drawAll(cx, false); }); }

// ----- 指の操作：キャラ・ロゴ・小さい写真を動かす。何もないところは写真を動かす -----
const pts = new Map(); let drag = null;
function toCv(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
function hit(p){
  const W = cv.width, H = cv.height, m = logoMetrics();
  if(Math.abs(p.x - S.logo.x * W) < m.w / 2 + 10 && Math.abs(p.y - S.logo.y * H) < m.h / 2 + 10) return "logo";
  for(let i = S.stickers.length - 1; i >= 0; i--){
    const st = S.stickers[i], b = stBox(st), dx = p.x - b.cx, dy = p.y - b.cy, c = Math.cos(-st.rot), s = Math.sin(-st.rot);
    const lx = dx * c - dy * s, ly = dx * s + dy * c; if(Math.abs(lx) < b.w * .42 && Math.abs(ly) < b.h * .42) return st;
  }
  const sl = slots();
  if(S.lay === "real" && sl[1]){ const s = sl[1]; if(p.x > s.x && p.x < s.x + s.w && p.y > s.y && p.y < s.y + s.h) return "inset"; }

}
function slotAt(p){ const sl = slots(); for(let i = sl.length - 1; i >= 0; i--){ const s = sl[i]; if(p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h) return s; } return sl[0]; }

    const p = ps[0], h = hit(p);
    if(h){ S.sel = h; if(h !== "logo" && h !== "inset"){ S.stickers.splice(S.stickers.indexOf(h), 1); S.stickers.push(h); } drag = { kind: "obj", obj: h, last: p }; showTabFor(h); }

    const [a, b] = ps; drag.d0 = Math.hypot(a.x - b.x, a.y - b.y); drag.a0 = Math.atan2(b.y - a.y, b.x - a.x);
    const o = drag.obj; drag.base = drag.kind === "pan" ? { z: S.view[drag.slot.k].z } : o === "logo" ? { s: S.logo.s } : o === "inset" ? { w: S.inset.w } : { w: o.w, rot: o.rot };

cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, toCv(e)); startGesture(); });

    if(drag.kind === "pan") S.view[drag.slot.k].z = Math.max(1, Math.min(4, drag.base.z * k));
    else if(o === "logo") S.logo.s = Math.max(.7, Math.min(1.8, drag.base.s * k));

(async () => {

  try{ await Promise.all(["KZ Pop", "KZ Hand", "KZ Bold"].map(f => document.fonts.load("40px '" + f + "'", "コツンズ"))); }catch(e){}
  drawStyles(); render();
  startCam("user");
})();
</script>
